[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "atif-scan"
version = "0.1.0"
description = "Composable, evidence-scoped behavioral checks over ATIF trajectories"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atif-scan = "atif_scan.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
