<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>atif-scan · judge review</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="review.css">
  <script defer src="data.js"></script>
  <script defer src="review.js"></script>
</head>
<body>
  <header class="bar">
    <div class="brand"><strong>atif-scan</strong> <span>/ judge review</span> <span id="question" class="muted"></span></div>
    <div class="progress"><span id="progress"></span><div class="meter"><i id="meter"></i></div></div>
    <div class="tools">
      <div class="filters" role="group" aria-label="Show">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="split" aria-pressed="false">Judges disagree</button>
        <button type="button" data-filter="todo" aria-pressed="false">Unlabelled</button>
      </div>
      <button id="export" type="button">Export labels</button>
      <button id="theme" type="button">Dark</button>
    </div>
  </header>
  <nav id="dots" class="dots" aria-label="Cards"></nav>
  <main id="card" class="card" aria-live="polite"></main>
  <footer class="keys">
    <span><kbd>P</kbd> present</span><span><kbd>A</kbd> absent</span><span><kbd>U</kbd> unclear</span>
    <span>then <kbd>1</kbd>–<kbd>3</kbd> kind (present)</span><span><kbd>S</kbd> skip</span>
    <span><kbd>J</kbd>/<kbd>K</kbd> or <kbd>→</kbd>/<kbd>←</kbd> move</span><span><kbd>N</kbd> note</span>
    <span><kbd>X</kbd> clear label</span><span><kbd>E</kbd> export</span>
    <span class="muted">Labels save in this browser as you go. Private: masked trace text and judges' reasons.</span>
  </footer>
</body>
</html>
