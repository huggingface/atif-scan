name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable tag to publish (for example v0.8.15)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.repository == 'huggingface/atif-scan' &&
      (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.11"
      - name: Validate tag, version and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: uv run --no-project python tools/pypi_release.py resolve --tag "$RELEASE_TAG"

  check:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  build:
    needs: [resolve, check]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      # Keep the workflow's validator separate from the immutable release checkout.
      # This also supports the first manual publication of the older v0.8.15 tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.11"
      - name: Build immutable release source
        run: uv build source --out-dir dist --no-create-gitignore
      - name: Check distribution metadata and tracked-only source contents
        run: >-
          uv run --no-project python automation/tools/pypi_release.py verify
          --source source --dist dist --version "$RELEASE_VERSION"
      - name: Smoke-test installed wheel and current dependency resolutions
        shell: bash
        run: |
          set -euo pipefail
          wheel="$PWD/dist/atif_scan-${RELEASE_VERSION}-py3-none-any.whl"
          uvx --isolated --refresh --python 3.11 --from "$wheel" atif-scan --help
          uvx --isolated --refresh --python 3.11 --from "$wheel" atif-inspect --help
          uvx --isolated --refresh --python 3.11 --from "$wheel" atif-scan \
            source/examples/synthetic.json --packs none --task synthetic-local \
            --format json > "$RUNNER_TEMP/synthetic-smoke.json"
          uv run --upgrade --isolated --no-project --python 3.11 --with "$wheel" \
            python automation/tools/pypi_release.py runtime
          uv run --upgrade --isolated --no-project --python 3.11 \
            --with "atif-scan[mcp] @ file://$wheel" python automation/tools/pypi_release.py runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions-${{ needs.resolve.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/atif-scan/
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, builds or package execution in the OIDC-enabled job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions-${{ needs.resolve.outputs.version }}
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: false
          attestations: true
